<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具 | Rex Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
        }
        
        .input-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .input-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .options {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .option label {
            cursor: pointer;
            color: #555;
        }
        
        .option-select {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .option-select label {
            color: #555;
            font-size: 14px;
        }
        
        .option-select select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }
        
        .option-select select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .history-section {
            margin-top: 30px;
        }
        
        .history-header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .history-header-main h2 {
            color: white;
            margin: 0;
        }
        
        .btn-delete-all {
            background: #dc3545;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-delete-all:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        
        .history-item {
            background: white;
            border-radius: 15px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .history-header {
            background: #f8f9fa;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .history-header:hover {
            background: #e9ecef;
        }
        
        .history-header.collapsed {
            border-bottom: none;
        }
        
        .history-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .timestamp {
            color: #666;
            font-size: 14px;
        }
        
        .status {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .spec-badge {
            padding: 2px 8px;
            background: #e9ecef;
            color: #495057;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .toggle-icon {
            font-size: 12px;
            color: #666;
            transition: transform 0.3s;
        }
        
        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }
        
        .history-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn-small {
            padding: 6px 15px;
            font-size: 13px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-copy {
            background: #667eea;
            color: white;
        }
        
        .btn-download {
            background: #28a745;
            color: white;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .history-content {
            padding: 20px;
            transition: max-height 0.3s ease, padding 0.3s ease;
            max-height: 2000px;
            overflow: hidden;
        }
        
        .history-content.collapsed {
            max-height: 0;
            padding: 0 20px;
        }
        
        /* 可折疊 JSON 樣式 */
        .json-viewer {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .json-line {
            display: flex;
            align-items: flex-start;
            padding: 1px 0;
        }
        
        .json-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 4px;
            cursor: pointer;
            user-select: none;
            font-size: 10px;
            color: #666;
            transition: transform 0.2s;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .json-toggle:hover {
            color: #333;
            background: #e0e0e0;
            border-radius: 3px;
        }
        
        .json-toggle.collapsed {
            transform: rotate(-90deg);
        }
        
        .json-toggle-placeholder {
            display: inline-block;
            width: 16px;
            margin-right: 4px;
            flex-shrink: 0;
        }
        
        .json-content {
            flex: 1;
            word-break: break-all;
        }
        
        .json-children {
            padding-left: 20px;
            border-left: 1px dotted #ddd;
            margin-left: 7px;
        }
        
        .json-children.collapsed {
            display: none;
        }
        
        .json-key {
            color: #d73a49;
            font-weight: 600;
        }
        
        .json-string {
            color: #032f62;
        }
        
        .json-number {
            color: #005cc5;
        }
        
        .json-boolean {
            color: #005cc5;
            font-weight: 600;
        }
        
        .json-null {
            color: #6f42c1;
            font-weight: 600;
        }
        
        .json-bracket {
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }
        
        .json-bracket:hover {
            background: #e9ecef;
            border-radius: 3px;
        }
        
        .json-comma {
            color: #333;
        }
        
        .json-ellipsis {
            color: #999;
            font-style: italic;
            cursor: pointer;
            padding: 0 4px;
        }
        
        .json-ellipsis:hover {
            color: #666;
            background: #f0f0f0;
            border-radius: 3px;
        }
        
        .empty-state {
            text-align: center;
            color: rgba(255,255,255,0.7);
            padding: 40px;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }
        
        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .history-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .history-actions {
                width: 100%;
                justify-content: flex-end;
            }
            
            .options {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 JSON 格式化工具</h1>
            <p>格式化、驗證、修復 JSON | 自動處理中文亂碼</p>
        </header>
        
        <div class="input-section">
            <h2>輸入 JSON</h2>
            <textarea id="jsonInput" placeholder="在此貼上 JSON 內容..."></textarea>
            <div id="errorContainer"></div>
            
            <div class="options">
                <div class="option">
                    <input type="checkbox" id="fixUnicode" checked>
                    <label for="fixUnicode">自動修復中文亂碼</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="sortKeys">
                    <label for="sortKeys">排序鍵名</label>
                </div>
                <div class="option-select">
                    <label for="jsonSpec">JSON Specification:</label>
                    <select id="jsonSpec">
                        <option value="rfc8259" selected>RFC 8259</option>
                        <option value="rfc7159">RFC 7159</option>
                        <option value="rfc4627">RFC 4627</option>
                        <option value="ecma404">ECMA-404</option>
                        <option value="skip">Skip Validation</option>
                    </select>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="formatJSON()">格式化</button>
                <button class="btn btn-secondary" onclick="clearInput()">清空</button>
                <button class="btn btn-secondary" onclick="loadExample()">載入範例</button>
            </div>
        </div>
        
        <div class="history-section">
            <div class="history-header-main">
                <h2>格式化記錄</h2>
                <button class="btn-delete-all" onclick="deleteAllHistory()" id="deleteAllBtn" style="display: none;">刪除所有</button>
            </div>
            <div id="historyList">
                <div class="empty-state">
                    <p>尚無格式化記錄</p>
                    <p>輸入 JSON 並點擊「格式化」開始</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Rex Tools | 純前端處理，資料不會傳送到伺服器</p>
        </footer>
    </div>

    <script>
        // 儲存格式化記錄
        let history = JSON.parse(localStorage.getItem('jsonHistory') || '[]');
        renderHistory();
        
        // Enter 鍵觸發格式化
        document.getElementById('jsonInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                formatJSON();
            }
        });
        
        // 格式化 JSON
        function formatJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            const errorContainer = document.getElementById('errorContainer');
            const fixUnicode = document.getElementById('fixUnicode').checked;
            const sortKeys = document.getElementById('sortKeys').checked;
            const jsonSpec = document.getElementById('jsonSpec').value;
            
            errorContainer.innerHTML = '';
            
            if (!input) {
                showError('請輸入 JSON 內容');
                return;
            }
            
            try {
                let jsonString = input;
                
                // 修復中文亂碼
                if (fixUnicode) {
                    jsonString = fixChineseEncoding(jsonString);
                }
                
                // 根據規範驗證
                if (jsonSpec !== 'skip') {
                    const validationError = validateJSONSpec(jsonString, jsonSpec);
                    if (validationError) {
                        showError(`JSON 不符合 ${jsonSpec.toUpperCase()} 規範: ${validationError}`);
                        return;
                    }
                }
                
                // 解析 JSON
                let jsonObj = JSON.parse(jsonString);
                
                // 排序鍵名
                if (sortKeys) {
                    jsonObj = sortObjectKeys(jsonObj);
                }
                
                // 格式化輸出
                const formatted = JSON.stringify(jsonObj, null, 2);
                
                // 加入記錄
                addHistory(formatted, true, jsonSpec);
                
                // 清空輸入
                document.getElementById('jsonInput').value = '';
                
            } catch (e) {
                showError('JSON 格式錯誤: ' + e.message);
            }
        }
        
        // 驗證 JSON 規範
        function validateJSONSpec(jsonString, spec) {
            switch(spec) {
                case 'rfc4627':
                    const trimmed = jsonString.trim();
                    if (!trimmed.startsWith('{') && !trimmed.startsWith('[')) {
                        return '根元素必須是物件 (object) 或陣列 (array)';
                    }
                    break;
            }
            return null;
        }
        
        // 修復中文亂碼
        function fixChineseEncoding(str) {
            str = str.replace(/\\u([0-9a-fA-F]{4})/g, function(match, grp) {
                return String.fromCharCode(parseInt(grp, 16));
            });
            str = str.replace(/\\\//g, '/');
            str = str.replace(/\\n/g, '\n')
                     .replace(/\\t/g, '\t')
                     .replace(/\\r/g, '\r')
                     .replace(/\\b/g, '\b')
                     .replace(/\\f/g, '\f');
            return str;
        }
        
        // 排序物件鍵名
        function sortObjectKeys(obj) {
            if (Array.isArray(obj)) {
                return obj.map(sortObjectKeys);
            } else if (obj !== null && typeof obj === 'object') {
                const sorted = {};
                Object.keys(obj).sort().forEach(key => {
                    sorted[key] = sortObjectKeys(obj[key]);
                });
                return sorted;
            }
            return obj;
        }
        
        // 加入記錄
        function addHistory(formatted, success, jsonSpec = 'rfc8259') {
            const item = {
                id: Date.now(),
                timestamp: new Date().toLocaleString('zh-TW'),
                content: formatted,
                success: success,
                collapsed: false,
                spec: jsonSpec
            };
            
            history.unshift(item);
            if (history.length > 20) {
                history = history.slice(0, 20);
            }
            
            localStorage.setItem('jsonHistory', JSON.stringify(history));
            renderHistory();
        }
        
        // 切換收縮/展開
        function toggleCollapse(id) {
            const item = history.find(h => h.id == id);
            if (item) {
                item.collapsed = !item.collapsed;
                localStorage.setItem('jsonHistory', JSON.stringify(history));
                renderHistory();
            }
        }
        
        // 渲染記錄列表
        function renderHistory() {
            const container = document.getElementById('historyList');
            const deleteAllBtn = document.getElementById('deleteAllBtn');
            
            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>尚無格式化記錄</p>
                        <p>輸入 JSON 並點擊「格式化」開始</p>
                    </div>
                `;
                deleteAllBtn.style.display = 'none';
                return;
            }
            
            deleteAllBtn.style.display = 'inline-block';
            
            container.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-header ${item.collapsed ? 'collapsed' : ''}" onclick="toggleCollapse('${item.id}')">
                        <div class="history-info">
                            <span class="timestamp">${item.timestamp}</span>
                            <span class="status ${item.success ? 'success' : 'error'}">
                                ${item.success ? '成功' : '失敗'}
                            </span>
                            <span class="spec-badge">${item.spec ? item.spec.toUpperCase() : 'RFC 8259'}</span>
                            <span class="toggle-icon ${item.collapsed ? 'collapsed' : ''}">▼</span>
                        </div>
                        <div class="history-actions" onclick="event.stopPropagation()">
                            <button class="btn-small btn-copy" onclick="copyToClipboard('${item.id}', this)">複製</button>
                            <button class="btn-small btn-download" onclick="downloadJSON('${item.id}')">下載</button>
                            <button class="btn-small btn-delete" onclick="deleteHistory('${item.id}')">刪除</button>
                        </div>
                    </div>
                    <div class="history-content ${item.collapsed ? 'collapsed' : ''}">
                        <div class="json-viewer" id="viewer-${item.id}">${renderFoldableJSON(JSON.parse(item.content))}</div>
                    </div>
                </div>
            `).join('');
        }
        
        // 渲染可折疊 JSON
        function renderFoldableJSON(obj, key = null, isLast = true) {
            const childrenId = 'children-' + Math.random().toString(36).substr(2, 9);
            
            if (obj === null) {
                return renderValue(key, '<span class="json-null">null</span>', isLast);
            }
            
            if (typeof obj === 'boolean') {
                return renderValue(key, `<span class="json-boolean">${obj}</span>`, isLast);
            }
            
            if (typeof obj === 'number') {
                return renderValue(key, `<span class="json-number">${obj}</span>`, isLast);
            }
            
            if (typeof obj === 'string') {
                const str = escapeHtml(JSON.stringify(obj));
                return renderValue(key, `<span class="json-string">${str}</span>`, isLast);
            }
            
            if (Array.isArray(obj)) {
                if (obj.length === 0) {
                    return renderValue(key, '[]', isLast);
                }
                
                let html = `<div class="json-line">`;
                html += `<span class="json-toggle" onclick="toggleJSON('${childrenId}', this)">▼</span>`;
                html += `<div class="json-content">`;
                if (key !== null) {
                    html += `<span class="json-key">"${escapeHtml(key)}"</span>: `;
                }
                html += `<span class="json-bracket">[</span></div>`;
                html += `</div>`;
                
                html += `<div class="json-children" id="${childrenId}">`;
                obj.forEach((item, index) => {
                    html += renderFoldableJSON(item, null, index === obj.length - 1);
                });
                html += `<div class="json-line"><span class="json-toggle-placeholder"></span><div class="json-content"><span class="json-bracket">]</span>${isLast ? '' : ','}</div></div>`;
                html += `</div>`;
                
                return html;
            }
            
            // 物件
            const keys = Object.keys(obj);
            if (keys.length === 0) {
                return renderValue(key, '{}', isLast);
            }
            
            let html = `<div class="json-line">`;
            html += `<span class="json-toggle" onclick="toggleJSON('${childrenId}', this)">▼</span>`;
            html += `<div class="json-content">`;
            if (key !== null) {
                html += `<span class="json-key">"${escapeHtml(key)}"</span>: `;
            }
            html += `<span class="json-bracket">{</span></div>`;
            html += `</div>`;
            
            html += `<div class="json-children" id="${childrenId}">`;
            keys.forEach((k, index) => {
                html += renderFoldableJSON(obj[k], k, index === keys.length - 1);
            });
            html += `<div class="json-line"><span class="json-toggle-placeholder"></span><div class="json-content"><span class="json-bracket">}</span>${isLast ? '' : ','}</div></div>`;
            html += `</div>`;
            
            return html;
        }
        
        // 渲染單個值
        function renderValue(key, valueHtml, isLast) {
            let html = `<div class="json-line">`;
            html += `<span class="json-toggle-placeholder"></span>`;
            html += `<div class="json-content">`;
            if (key !== null) {
                html += `<span class="json-key">"${escapeHtml(key)}"</span>: ${valueHtml}${isLast ? '' : ','}`;
            } else {
                html += `${valueHtml}${isLast ? '' : ','}`;
            }
            html += `</div></div>`;
            return html;
        }
        
        // 切換 JSON 折疊
        function toggleJSON(childrenId, toggleEl) {
            event.stopPropagation();
            const children = document.getElementById(childrenId);
            if (children) {
                const isCollapsed = children.classList.toggle('collapsed');
                toggleEl.classList.toggle('collapsed', isCollapsed);
                toggleEl.textContent = isCollapsed ? '▶' : '▼';
            }
        }
        
        // 轉義 HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 複製到剪貼簿
        function copyToClipboard(id, btn) {
            const item = history.find(h => h.id == id);
            if (item) {
                navigator.clipboard.writeText(item.content).then(() => {
                    const originalText = btn.textContent;
                    btn.textContent = '✓ 已複製';
                    btn.style.background = '#28a745';
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.background = '';
                    }, 1500);
                }).catch(err => {
                    console.error('複製失敗:', err);
                });
            }
        }
        
        // 下載 JSON 檔案
        function downloadJSON(id) {
            const item = history.find(h => h.id == id);
            if (item) {
                const blob = new Blob([item.content], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                const date = new Date(item.id);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
                a.download = `formatted-${year}${month}${day}-${hours}${minutes}${seconds}.json`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }
        
        // 刪除所有記錄
        function deleteAllHistory() {
            history = [];
            localStorage.setItem('jsonHistory', JSON.stringify(history));
            renderHistory();
        }
        
        // 刪除單筆記錄
        function deleteHistory(id) {
            history = history.filter(h => h.id != id);
            localStorage.setItem('jsonHistory', JSON.stringify(history));
            renderHistory();
        }
        
        // 清空輸入
        function clearInput() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('errorContainer').innerHTML = '';
        }
        
        // 載入範例
        function loadExample() {
            const example = {
                "name": "測試資料",
                "version": "1.0.0",
                "features": ["格式化", "驗證", "修復中文亂碼", "折疊檢視"],
                "settings": {
                    "autoFix": true,
                    "theme": "dark",
                    "nested": {
                        "level1": {
                            "level2": {
                                "level3": "深度巢狀結構"
                            }
                        }
                    }
                },
                "count": 42,
                "active": true,
                "data": null
            };
            document.getElementById('jsonInput').value = JSON.stringify(example, null, 2);
        }
        
        // 顯示錯誤訊息
        function showError(message) {
            document.getElementById('errorContainer').innerHTML = `
                <div class="error-message">${message}</div>
            `;
        }
    </script>
</body>
</html>
